<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아이닉 이벤트 관리 리포트</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--brand:#3f3939;--ink:#2b2725;--sub:#8a827c;--line:#ece8e4;--bg:#f6f4f2;--card:#fff;
    --ok:#12a150;--bad:#e5484d;--warn:#e08a1e;}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
  h1{font-size:20px;font-weight:800;margin:0}
  h1 .sub{font-size:12.5px;color:var(--sub);font-weight:600;margin-left:8px}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button{border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:13px;
    padding:9px 14px;border-radius:9px;cursor:pointer}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .tile .lbl{font-size:11.5px;color:var(--sub);font-weight:700}
  .tile .val{font-size:24px;font-weight:800;margin-top:4px}
  .tile .val small{font-size:13px;color:var(--sub);font-weight:600}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  @media(max-width:820px){.tiles{grid-template-columns:repeat(3,1fr)}.row2{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .panel h3{margin:0 0 10px;font-size:14px;font-weight:800}
  .mini{width:100%;border-collapse:collapse;font-size:12.5px}
  .mini td{padding:6px 4px;border-bottom:1px solid var(--line)}
  .mini td:last-child{text-align:right;font-weight:700}
  .bar{height:8px;background:var(--brand);border-radius:4px;display:inline-block;vertical-align:middle}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  select,input[type=text]{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff}
  .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}
  table.data{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
  table.data th{position:sticky;top:0;background:#faf8f6;text-align:left;padding:10px 10px;border-bottom:1.5px solid var(--line);font-weight:800;font-size:11.5px}
  table.data td{padding:9px 10px;border-bottom:1px solid var(--line)}
  table.data tr:hover td{background:#faf8f6}
  .pill{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px}
  .pill.gift{background:#eaf3ee;color:var(--ok)}
  .pill.coupon{background:#fdf0e3;color:var(--warn)}
  .pill.review{background:#eef1f5;color:#4a5568}
  .pill.coupang{background:#e9f0fb;color:#2f6df6}
  a.img{color:var(--brand);text-decoration:underline}
  .empty{padding:40px;text-align:center;color:var(--sub);font-size:13px}
  .note{font-size:11.5px;color:var(--sub);margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>아이닉 이벤트 관리 리포트 <span class="sub" id="asof">불러오는 중…</span></h1>
    <div class="btns">
      <button id="reload">↻ 새로고침</button>
      <button id="dlOrder">📦 발주용 다운로드</button>
      <button id="dlAcct">🎟️ 회계용 다운로드</button>
      <button id="csv">CSV(전체)</button>
      <button class="primary" id="xlsx">엑셀(전체)</button>
    </div>
  </header>

  <div class="tiles" id="tiles"></div>

  <div class="row2">
    <div class="panel"><h3>제품별 참여</h3><table class="mini" id="byProduct"></table></div>
    <div class="panel"><h3>구입처별 참여</h3><table class="mini" id="bySource"></table></div>
  </div>

  <div class="filters">
    <select id="fType"><option value="">유형 전체</option><option value="review">포토리뷰</option><option value="coupang">쿠팡 정품등록</option></select>
    <select id="fReward"><option value="">보상 전체</option><option value="gift">사은품(발주)</option><option value="coupon">상품권(회계)</option></select>
    <select id="fCategory"><option value="">카테고리 전체</option></select>
    <input type="text" id="fSearch" placeholder="이름·연락처·주문번호 검색">
    <span id="count" style="font-size:12.5px;color:var(--sub);font-weight:700"></span>
  </div>

  <div class="tablewrap">
    <table class="data" id="table"><thead></thead><tbody></tbody></table>
    <div class="empty" id="empty" style="display:none">데이터가 없습니다.</div>
  </div>
  <div class="note">※ 이 페이지는 고객 개인정보를 포함합니다. 실제 운영 시에는 관리자 로그인으로 접근을 제한하세요(보안 규칙 적용 예정).</div>
</div>

<script>
/* ===== Firebase 설정 (접수 폼과 동일) ===== */
const FIREBASE_CONFIG={apiKey:"AIzaSyDEp7NfsOHEHwsqW4r0NNRtJ2x4S7yrwjE",authDomain:"inic-event.firebaseapp.com",projectId:"inic-event",
  storageBucket:"inic-event.firebasestorage.app",messagingSenderId:"873742787714",appId:"1:873742787714:web:d66ab14b9d4d8ed5e4409b"};
const COLLECTION="reviewEntries";

const $=s=>document.querySelector(s);
let ALL=[];   // 전체 데이터
const TYPE_LABEL={review:"포토리뷰",coupang:"쿠팡 정품등록"};
const REWARD_LABEL={gift:"사은품",coupon:"상품권"};

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error(src));document.head.appendChild(s);});}
async function initFirebase(){
  if(window._db) return window._db;
  await loadScript("https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js");
  await loadScript("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js");
  firebase.initializeApp(FIREBASE_CONFIG); window._db=firebase.firestore(); return window._db;
}
async function loadData(){
  $("#asof").textContent="불러오는 중…";
  try{
    const db=await initFirebase();
    const snap=await db.collection(COLLECTION).get();
    ALL=snap.docs.map(d=>{const x=d.data(); x._id=d.id;
      x._date = x.createdAt && x.createdAt.toDate ? x.createdAt.toDate() : null; return x;});
    ALL.sort((a,b)=>(b._date?.getTime()||0)-(a._date?.getTime()||0));
    const now=new Date();
    $("#asof").textContent="기준 "+now.toLocaleString("ko-KR")+" · 총 "+ALL.length+"건";
    buildCategoryFilter(); renderAll();
  }catch(err){ console.error(err); $("#asof").textContent="불러오기 실패: "+(err.message||err); }
}
function fmtDate(d){ if(!d) return "-"; const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes()); }

function buildCategoryFilter(){
  const cats=[...new Set(ALL.map(e=>e.category).filter(Boolean))];
  const sel=$("#fCategory"); sel.innerHTML='<option value="">카테고리 전체</option>'+cats.map(c=>`<option>${c}</option>`).join("");
}
function filtered(){
  const t=$("#fType").value, r=$("#fReward").value, c=$("#fCategory").value, q=$("#fSearch").value.trim().toLowerCase();
  return ALL.filter(e=>{
    if(t && e.type!==t) return false;
    if(r && e.rewardType!==r) return false;
    if(c && e.category!==c) return false;
    if(q){ const hay=[e.name,e.phone,e.orderNo,e.serial,e.custId].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}
function renderAll(){ renderTiles(); renderAgg(); renderTable(); }

function renderTiles(){
  const a=ALL;
  const review=a.filter(e=>e.type==="review").length, coupang=a.filter(e=>e.type==="coupang").length;
  const gift=a.filter(e=>e.rewardType==="gift").length, coupon=a.filter(e=>e.rewardType==="coupon").length;
  const today=new Date(); const isToday=e=>e._date && e._date.toDateString()===today.toDateString();
  const todayN=a.filter(isToday).length;
  const tiles=[["총 참여",a.length,""],["포토리뷰",review,""],["쿠팡 정품등록",coupang,""],
    ["사은품(발주)",gift,"물리 배송"],["상품권(회계)",coupon,"기프티콘"],["오늘 접수",todayN,""]];
  $("#tiles").innerHTML=tiles.map(([l,v,s])=>`<div class="tile"><div class="lbl">${l}</div><div class="val">${v}<small> ${s||""}</small></div></div>`).join("");
}
function aggTable(el,keyFn){
  const m={}; ALL.forEach(e=>{const k=keyFn(e)||"(미상)"; m[k]=(m[k]||0)+1;});
  const rows=Object.entries(m).sort((a,b)=>b[1]-a[1]); const max=rows.length?rows[0][1]:1;
  $(el).innerHTML=rows.map(([k,v])=>`<tr><td>${k}</td><td><span class="bar" style="width:${Math.max(6,v/max*90)}px"></span> ${v}</td></tr>`).join("")||'<tr><td class="empty">데이터 없음</td></tr>';
}
function renderAgg(){
  aggTable("#byProduct", e=>{const nm=e.product; return nm;});
  aggTable("#bySource", e=>e.source);
}

const COLS=[
  ["_date","접수일시",e=>fmtDate(e._date)],
  ["type","유형",e=>`<span class="pill ${e.type}">${TYPE_LABEL[e.type]||e.type}</span>`],
  ["category","카테고리",e=>e.category||"-"],
  ["product","제품",e=>e.product||"-"],
  ["rewardType","보상",e=>`<span class="pill ${e.rewardType}">${REWARD_LABEL[e.rewardType]||"-"}</span>`],
  ["giftItem","사은품/상품권",e=>e.giftItem||"-"],
  ["source","구입처",e=>e.source||"-"],
  ["custId","고객ID",e=>e.custId||"-"],
  ["orderNo","주문번호",e=>e.orderNo||"-"],
  ["serial","S/N",e=>e.serial||"-"],
  ["name","수령인",e=>e.name||"-"],
  ["phone","연락처",e=>e.phone||"-"],
  ["address","주소",e=>e.address||"-"],
  ["status","상태",e=>e.status||"-"],
  ["imageUrl","이미지",e=>e.imageUrl?`<a class="img" href="${e.imageUrl}" target="_blank">보기</a>`:"-"]
];
function renderTable(){
  const rows=filtered();
  $("#count").textContent="표시 "+rows.length+"건";
  $("#table thead").innerHTML="<tr>"+COLS.map(c=>`<th>${c[1]}</th>`).join("")+"</tr>";
  $("#table tbody").innerHTML=rows.map(e=>"<tr>"+COLS.map(c=>`<td>${c[2](e)}</td>`).join("")+"</tr>").join("");
  $("#empty").style.display=rows.length?"none":"block";
}

/* ===== 다운로드 ===== */
function exportRows(){
  return filtered().map(e=>({
    "접수일시":fmtDate(e._date),"유형":TYPE_LABEL[e.type]||e.type,"카테고리":e.category||"",
    "제품":e.product||"","보상종류":REWARD_LABEL[e.rewardType]||"","사은품/상품권":e.giftItem||"",
    "구입처":e.source||"","고객ID":e.custId||"","주문번호":e.orderNo||"","S/N":e.serial||"",
    "수령인":e.name||"","연락처":e.phone||"","주소":e.address||"","상태":e.status||"",
    "마케팅동의":(e.consent&&e.consent.marketing)||"","이미지URL":e.imageUrl||"","문서ID":e._id||""
  }));
}
function todayStr(){const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());}
function downloadRows(rows, baseName){
  if(!rows.length){alert("대상 데이터가 없습니다.");return;}
  const fname=baseName+"_"+todayStr();
  if(typeof XLSX!=="undefined"){
    const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"data"); XLSX.writeFile(wb,fname+".xlsx");
  } else {
    const heads=Object.keys(rows[0]);
    const csv=[heads.join(",")].concat(rows.map(r=>heads.map(h=>`"${String(r[h]==null?"":r[h]).replace(/"/g,'""')}"`).join(","))).join("\n");
    const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname+".csv"; a.click();
  }
}
$("#xlsx").addEventListener("click",()=>downloadRows(exportRows(),"아이닉이벤트_리포트"));
$("#csv").addEventListener("click",()=>{
  const rows=exportRows(); if(!rows.length){alert("다운로드할 데이터가 없습니다.");return;}
  const heads=Object.keys(rows[0]);
  const csv=[heads.join(",")].concat(rows.map(r=>heads.map(h=>`"${String(r[h]).replace(/"/g,'""')}"`).join(","))).join("\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="아이닉이벤트_리포트_"+todayStr()+".csv"; a.click();
});

/* 팀별 전용 다운로드 (사은품=발주 / 상품권=회계) */
function exportTeam(rewardType, cols, fname){
  const rows=ALL.filter(e=>e.rewardType===rewardType).map(e=>{const o={};cols.forEach(([label,fn])=>o[label]=fn(e));return o;});
  downloadRows(rows, fname);
}
const ORDER_COLS=[["접수일시",e=>fmtDate(e._date)],["카테고리",e=>e.category||""],["제품",e=>e.product||""],["사은품",e=>e.giftItem||""],["수령인",e=>e.name||""],["연락처",e=>e.phone||""],["주소",e=>e.address||""],["주문번호",e=>e.orderNo||""],["구입처",e=>e.source||""],["상태",e=>e.status||""],["문서ID",e=>e._id||""]];
const ACCT_COLS=[["접수일시",e=>fmtDate(e._date)],["카테고리",e=>e.category||""],["제품",e=>e.product||""],["상품권",e=>e.giftItem||""],["수령인",e=>e.name||""],["연락처",e=>e.phone||""],["주문번호",e=>e.orderNo||""],["구입처",e=>e.source||""],["상태",e=>e.status||""],["문서ID",e=>e._id||""]];
$("#dlOrder").addEventListener("click",()=>exportTeam("gift",ORDER_COLS,"아이닉_발주목록(사은품)"));
$("#dlAcct").addEventListener("click",()=>exportTeam("coupon",ACCT_COLS,"아이닉_회계목록(상품권)"));

["#fType","#fReward","#fCategory"].forEach(s=>$(s).addEventListener("change",renderTable));
$("#fSearch").addEventListener("input",renderTable);
$("#reload").addEventListener("click",loadData);

/* 테스트용: window.__mock(data) 로 목데이터 주입 가능 */
window.__render=(data)=>{ ALL=data.map(x=>({...x,_date:x._date?new Date(x._date):null})); $("#asof").textContent="목데이터 "+ALL.length+"건"; buildCategoryFilter(); renderAll(); };

loadData();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>광고성 정보 수신동의 철회 · 아이닉</title>
<!--
  ═══════════════════════════════════════════════════════════════════════
  consent.html — 확인 메일의 「수신 철회하기」 링크가 오는 곳
  ───────────────────────────────────────────────────────────────────────
  🔴 이 화면에는 **버튼이 없습니다.** 열리는 즉시 철회가 처리되고
     결과만 보여 줍니다(2026-09-10 담당자 결정).

     예전에는 여기서 「수신 철회하기」를 한 번 더 눌러야 했는데,
     메일에서 이미 같은 이름의 버튼을 누르고 온 고객이
     「왜 또?」 하며 그냥 나가 버렸습니다. 그러면 철회 의사를 밝혔는데
     처리가 안 된 상태로 남아 더 위험합니다.

  🔴 메일 보안 프로그램이 링크를 미리 열어 보는 문제는 이렇게 피합니다 —
     철회는 **자바스크립트가 돌아야** 일어납니다. 스캐너는 주소만 열어 보고
     자바스크립트를 실행하지 않으므로 저절로 철회되지 않습니다.
     ⚠️ 그래서 이 처리를 서버 쪽 주소 한 번으로 바꾸면 안 됩니다.

  🔴 「수신 유지」 버튼을 만들지 마세요. 아무것도 안 하면 유지가 원칙입니다.
  🔴 로그인·본인확인을 넣지 마세요. 법이 「비용 부담 없이」 거부할 수 있게 하랬습니다.
     대신 화면에는 가린 정보만 보여 줍니다(테*트 · cu****@naver.com).

  올리는 곳 : 깃허브 저장소 최상위
  ═══════════════════════════════════════════════════════════════════════
-->
<style>
  :root{--brand:#3f3939;--ink:#2b2725;--sub:#8a827c;--line:#ece8e4;--bg:#f6f4f2;--card:#fff;
    --ok:#12a150;--bad:#e5484d;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:520px;margin:0 auto;padding:0 0 60px}
  header{background:#fff;border-bottom:1px solid var(--line);padding:22px 22px 18px;text-align:center}
  header h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.3px}
  header p{margin:6px 0 0;font-size:12.5px;color:var(--sub);line-height:1.55}
  .card{background:var(--card);margin:14px;border:1px solid var(--line);border-radius:14px;padding:20px}

  .done{text-align:center;padding:6px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .done .ico{width:46px;height:46px;border-radius:50%;background:#e9f4ee;color:var(--ok);
    font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
  .done h2{margin:0 0 4px;font-size:18px;font-weight:800}
  .done p{margin:0;font-size:12.5px;color:var(--sub)}

  .kv{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fbfaf9}
  .kv .r{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.5}
  .kv .r:last-child{border-bottom:none}
  .kv .k{flex:0 0 86px;color:var(--sub);font-weight:700;font-size:12.5px}
  .kv .v{flex:1;font-weight:700;word-break:break-all}

  .note{font-size:12.5px;color:var(--sub);line-height:1.75;margin:16px 0 0}
  .note b{color:var(--ink)}
  .oops{margin-top:16px;padding:12px 14px;background:#faf8f6;border-radius:10px;
    font-size:12.5px;color:var(--sub);line-height:1.7}
  .oops b{color:var(--ink)}

  .msg{margin:14px;padding:16px;border-radius:12px;font-size:13.5px;line-height:1.75}
  .msg.err{background:#fbedee;color:#b23b3b}
  .spin{text-align:center;color:var(--sub);font-size:13px;padding:46px 0}
  footer{text-align:center;font-size:11.5px;color:var(--sub);line-height:1.7;padding:6px 20px 0}
  .hide{display:none !important}
  @media (prefers-color-scheme: dark){
    :root{--ink:#f0ebe7;--sub:#a29892;--line:#3a3533;--bg:#211e1d;--card:#2a2624;--brand:#e8e2de}
    header{background:var(--card)} .kv{background:#231f1e} .oops{background:#332e2c}
    .done .ico{background:#1c3327}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="hTitle">광고성 정보 수신동의</h1>
    <p>정보통신망법 제50조제8항에 따른 안내입니다.</p>
  </header>

  <div class="spin" id="loading">처리하고 있습니다…</div>

  <div class="msg err hide" id="err"></div>

  <div class="card hide" id="done">
    <div class="done">
      <div class="ico">✓</div>
      <h2 id="dTitle">수신 철회가 처리되었습니다</h2>
      <p id="dWhen"></p>
    </div>

    <div class="kv">
      <div class="r"><span class="k">성함</span><span class="v" id="vName">-</span></div>
      <div class="r"><span class="k">이메일</span><span class="v" id="vMail">-</span></div>
      <div class="r"><span class="k">동의하신 날</span><span class="v" id="vDate">-</span></div>
      <div class="r"><span class="k">보내는 곳</span><span class="v" id="vFrom">-</span></div>
    </div>

    <p class="note">
      앞으로 <b>마케팅 정보를 보내드리지 않습니다.</b>
      처리 결과를 <b>메일로도</b> 보내 드렸습니다.<br>
      ※ 이미 신청하신 <b>이벤트 사은품 발송 등 필수 안내</b>는 계속 발송될 수 있습니다.
    </p>

    <div class="oops">
      <b>잘못 눌러 들어오셨나요?</b><br>
      아래 고객센터로 연락해 주시면 되돌려 드립니다.
    </div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
/* 창구 주소 — 접수폼(index.html)과 같은 지역에 있습니다 */
var API = "https://asia-northeast3-inic-event.cloudfunctions.net/consentApi";

var $ = function(s){ return document.querySelector(s); };
var show = function(s, on){ var el=$(s); if(el) el.classList.toggle("hide", !on); };
var esc  = function(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); };

var tok = (function(){
  var m = /[?&]t=([^&]+)/.exec(location.search);
  return m ? decodeURIComponent(m[1]) : "";
})();

/* 안내 문구 — 링크가 만료됐거나 잘못된 경우.
   ⚠️ 「없는 사람입니다」처럼 남의 정보를 알려 주는 말을 쓰지 않습니다. */
var LINK_BAD =
  "이 링크는 <b>사용 기간이 지났거나 올바르지 않습니다.</b><br>" +
  "가장 최근에 받으신 안내 메일의 링크를 다시 눌러 주세요.<br>" +
  "계속 같은 화면이 나오면 아래 고객센터로 연락해 주시면 바로 처리해 드립니다.";

function fail(msg){
  show("#loading", false);
  $("#err").innerHTML = msg;
  show("#err", true);
}

function paint(r){
  show("#loading", false);
  $("#hTitle").textContent = "광고성 정보 수신동의 철회";
  $("#vName").textContent = r.name || "고객";
  $("#vMail").textContent = r.email || "-";
  $("#vDate").textContent = r.consentAt || "-";
  $("#vFrom").textContent = r.company || "주식회사 아이닉";
  $("#foot").innerHTML = esc(r.company || "주식회사 아이닉")
    + "<br>문의 : 고객센터 " + esc(r.tel || "");

  /* 이미 철회하신 분이 링크를 또 누른 경우에도 같은 화면을 보여 드립니다 */
  $("#dTitle").textContent = r.already
    ? "이미 철회하셨습니다"
    : "수신 철회가 처리되었습니다";
  $("#dWhen").textContent = r.withdrawnAt ? (r.withdrawnAt + " 처리") : "";
  show("#done", true);
}

if (!tok) {
  fail(LINK_BAD);
} else {
  /* 🔴 들어오자마자 바로 철회합니다. 버튼을 한 번 더 누르게 하지 않습니다. */
  fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "withdraw", t: tok })
  }).then(function(r){ return r.json(); })
    .then(function(r){
      if (!r || !r.ok) return fail(LINK_BAD);
      paint(r);
    })
    .catch(function(){
      fail("일시적으로 연결이 되지 않습니다.<br>잠시 후 이 주소를 다시 열어 주세요.");
    });
}
</script>
</body>
</html>
